name: (scratch) Measure Worker CPU time

on:
  workflow_dispatch:

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tail production logs while hitting /projects
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec wrangler tail --format json > tail.log &
          TAIL_PID=$!
          sleep 5
          for i in 1 2 3 4 5; do
            curl -s -o /dev/null -w "request $i: %{http_code}\n" https://portfolio-on-firebase.utakata.workers.dev/projects
          done
          sleep 8
          kill "$TAIL_PID" || true
          wait "$TAIL_PID" 2>/dev/null || true
          echo "----- tail.log -----"
          cat tail.log
